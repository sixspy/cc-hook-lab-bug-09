</head>
<body>
<header class="顶栏">
    <div class="牌">投递台</div>
    <nav>
      <a href="/">投递台</a>
      <a href="/端点名册.html">端点名册</a>

  <main class="主区">
    <header class="页头">
      <h1>事件详情</h1>
      <p>Webhook 投递控制台 · 应用开发全栈 · 非工单客服</p>
    </header>

<section class="卷">
  <label>事件号</label><input id="事件号"/>
  <button class="按钮" type="button" id="查">查询</button>
  <pre id="出" class="说明"></pre>
</section>

  </main>

<script>
document.getElementById('查').onclick = async () => {
  try {
    const id = document.getElementById('事件号').value;
    document.getElementById('出').textContent = JSON.stringify(await 投递台.getJSON('/api/事件/'+encodeURIComponent(id)), null, 2);
  } catch (e) { document.getElementById('出').textContent = e.message; }
};
</script>
